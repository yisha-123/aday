<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>A DAY TOGETHER</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { width:100%; height:100%; overflow:hidden; background:#cfe8ff;
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; user-select:none; }

#stage {
  position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
  width:100vw; height:100vh; max-width:56.25vh; max-height:177.78vw;
  overflow:hidden; background:#cfe8ff;
}

.page { position:absolute; inset:0; opacity:0; pointer-events:none; transition:opacity .45s ease; z-index:1; }
.page.active { opacity:1; pointer-events:auto; z-index:2; }
.page .bg-img, .page .bg-video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }

.q-btn {
  width:46px; height:46px; border:none; cursor:pointer;
  background:#ffffff; border:2px solid #ffd6a3; border-radius:14px;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 2px 6px rgba(180,140,100,.18);
  transition:transform .12s; padding:0;
}
.q-btn:active { transform:scale(.9); }
.q-btn svg { width:24px; height:24px; display:block; }
.q-btn.hide { display:none; }

#rightStack {
  position:absolute; right:14px;
  top:calc(env(safe-area-inset-top,0px) + 12px);
  display:flex; flex-direction:column; gap:10px;
  z-index:60; opacity:0; transition:opacity .3s; pointer-events:none;
}
#rightStack.show { opacity:1; pointer-events:auto; }
#rightStack .q-btn { pointer-events:auto; }

#btnBack {
  position:absolute; left:14px;
  top:calc(env(safe-area-inset-top,0px) + 12px);
  z-index:60; opacity:0; transition:opacity .3s; pointer-events:none;
}
#btnBack.show { opacity:1; pointer-events:auto; }

#dialog {
  position:absolute; left:14px; right:14px;
  bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  display:flex; align-items:center; gap:0;
  z-index:40; opacity:0; transition:opacity .3s;
}
#dialog.show { opacity:1; }
#dialog .avatar {
  width:80px; height:80px; flex:0 0 80px;
  background-image:url('png/dialog-dog.png'); background-repeat:no-repeat;
  background-size:auto 100%; background-position:left center;
  margin-right:-30px; z-index:2;
}
#dialog .avatar.bird { background-image:url('png/dialog-bird.png'); }
#dialog .bubble {
  flex:1; min-height:74px; background:#fff6e6;
  border:2px solid #ffd6a3; border-radius:20px;
  padding:16px 18px 16px 50px; font-size:15px; color:#7a4018; line-height:1.5;
  box-shadow:0 4px 12px rgba(180,140,100,.18);
  display:flex; flex-direction:column; gap:6px; cursor:pointer; z-index:1;
}
#dialog .bubble .text { min-height:22px; }
#dialog .hint { font-size:12px; color:#b98a5a; text-align:right; }

/* ===== P1 ===== */
#p1 .bg-video { object-fit:cover; }
#btnStart {
  position:absolute; left:50%; bottom:5%;
  width:240px; height:76px;
  transform:translateX(-50%);
  border:none; cursor:pointer; z-index:5;
  background:url('png/btn-start.png') center/contain no-repeat;
  padding:0; transition:transform .15s;
}
#btnStart:active { transform:translateX(-50%) scale(.93); }

.fly-photo {
  position:fixed; z-index:200; width:60px; height:60px; object-fit:cover;
  border-radius:10px; border:2px solid #fff;
  box-shadow:0 4px 12px rgba(0,0,0,.3); pointer-events:none;
  transition:all .7s cubic-bezier(.4,0,.2,1);
}

#shootFrame {
  position:absolute; left:50%; top:50%;
  transform:translate(-50%,-50%) scale(.3);
  width:200px; padding:10px 10px 40px;
  background:#fff; border-radius:8px;
  box-shadow:0 10px 40px rgba(0,0,0,.4);
  z-index:400; opacity:0; pointer-events:none;
  transition:all .35s cubic-bezier(.34,1.56,.64,1);
}
#shootFrame.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
#shootFrame img { width:100%; display:block; border-radius:4px; object-fit:cover; aspect-ratio:1/1; }
#shootFrame .flash {
  position:absolute; inset:0; background:#fff; border-radius:8px;
  animation:flashOut .4s ease-out forwards;
}
@keyframes flashOut { 0%{opacity:1} 100%{opacity:0} }

/* ===== P3 翻牌 ===== */
#p3 .bg-video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
#card-mask {
  position:absolute; inset:0; background:rgba(0,0,0,.55);
  z-index:15; opacity:0; pointer-events:none; transition:opacity .35s;
}
#card-mask.show { opacity:1; pointer-events:auto; }
#card-game {
  position:absolute;
  left:50%; top:42%; transform:translate(-50%,-50%);
  width:80%; max-width:340px;
  display:grid; grid-template-columns:repeat(3,1fr); gap:12px;
  z-index:20; opacity:0; pointer-events:none; transition:opacity .35s;
}
#card-game.show { opacity:1; pointer-events:auto; }
.card {
  aspect-ratio:0.72/1;
  background-image:url('png/pai0.png');
  background-size:100% 100%; background-repeat:no-repeat;
  cursor:pointer; transition:transform .25s;
}
.card:active { transform:scale(.95); }
.card.flipped { background-image:var(--face); }
.card.matched { pointer-events:none; animation:matchedPop .5s ease; }
@keyframes matchedPop { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

/* ===== P4 ===== */
#p4 .bg-video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }

/* ===== P5 ===== */
#p5 { background:#cfe8ff; }
#p5 .bg-video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:1; }
#p5 .ingredient {
  position:absolute; width:110px; height:110px;
  top:68%; left:50%; transform:translate(-50%,-50%);
  background-position:center; background-repeat:no-repeat; background-size:contain;
  cursor:pointer; z-index:20;
  transition:transform .2s, opacity .3s;
  touch-action:manipulation; user-select:none; display:none;
}
#p5 .ingredient.show { display:block; }
#p5 .ingredient:active { transform:translate(-50%,-50%) scale(1.1); }
#p5 .ingredient.hidden { display:none !important; }
#p5 .ingredient.pos-left  { left:20%; }
#p5 .ingredient.pos-mid   { left:50%; }
#p5 .ingredient.pos-right { left:80%; }

#p5 .result {
  position:absolute; width:130px; height:130px;
  left:50%; top:68%; transform:translate(-50%,-50%);
  background-position:center; background-repeat:no-repeat; background-size:contain;
  z-index:11; opacity:0; transition:opacity .5s; pointer-events:none;
}
#p5 .result.show { opacity:1; animation:resultPop .6s ease; }
@keyframes resultPop {
  0%{transform:translate(-50%,-50%) scale(.5); opacity:0}
  60%{transform:translate(-50%,-50%) scale(1.1); opacity:1}
  100%{transform:translate(-50%,-50%) scale(1); opacity:1}
}

/* ===== P6 ===== */
#p6 .bg-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
#p6 .cloud {
  position:absolute; width:245px; height:165px;
  background:url('png/第六页-云朵互动分层PNG/02-普通云.png') center/contain no-repeat;
  cursor:pointer; z-index:15;
}
#p6 .cloud:active { transform:scale(.92); }
#p6 .cloud.changed { animation:cloudPop .6s ease; }
@keyframes cloudPop {
  0%{transform:scale(1) rotate(0)} 40%{transform:scale(1.3) rotate(10deg)} 100%{transform:scale(1) rotate(0)}
}

/* ===== P7 ===== */
#p7 .bg-video { object-fit:cover; }

/* ===== 结束弹窗 ===== */
#endMask {
  position:absolute; inset:0; background:rgba(20,10,0,.82);
  z-index:350; display:none; align-items:center; justify-content:center; padding:20px;
}
#endMask.show { display:flex; }
#endPanel {
  width:100%; max-width:340px;
  background:#fff6e6; border:3px solid #ffd6a3; border-radius:24px;
  padding:32px 24px; box-shadow:0 14px 50px rgba(0,0,0,.5);
  text-align:center;
  animation:endPop .5s cubic-bezier(.34,1.56,.64,1);
}
@keyframes endPop { 0% { transform:scale(.7); opacity:0; } 100% { transform:scale(1); opacity:1; } }
#endPanel .line1 { color:#7a4018; font-size:17px; font-weight:700; margin-bottom:12px; line-height:1.5; }
#endPanel .line2 { color:#b98a5a; font-size:15px; margin-bottom:24px; line-height:1.5; }
#endPanel .again-btn { height:54px; width:auto; border:none; cursor:pointer; background:transparent; padding:0; display:inline-block; }
#endPanel .again-btn img { height:100%; width:auto; display:block; }
#endPanel .again-btn:active { transform:scale(.94); }

/* ===== 相册弹窗 ===== */
#albumMask {
  position:absolute; inset:0; background:rgba(20,10,0,.85);
  z-index:250; display:none; align-items:center; justify-content:center; padding:20px;
}
#albumMask.show { display:flex; }
#albumPanel {
  width:100%; max-width:380px; max-height:82%;
  background:#fff6e6; border:3px solid #ffd6a3; border-radius:24px;
  padding:22px 18px; box-shadow:0 12px 40px rgba(0,0,0,.4);
  display:flex; flex-direction:column; align-items:center; overflow-y:auto;
}
#albumPanel h2 { color:#7a4018; font-size:20px; margin-bottom:6px; }
#albumPanel .sub { color:#b98a5a; font-size:13px; margin-bottom:16px; }
#albumGrid {
  display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
  width:100%; margin-bottom:16px;
}
.photo-card {
  position:relative; width:100%; aspect-ratio:1/1;
  cursor:pointer; overflow:hidden; border-radius:12px;
  border:2px solid #fff;
  box-shadow:0 3px 8px rgba(180,140,100,.25);
  transition:transform .15s;
}
.photo-card:active { transform:scale(.95); }
.photo-card img { width:100%; height:100%; object-fit:cover; display:block; }
.photo-card.locked {
  background:#f5e8d5; display:flex; align-items:center; justify-content:center;
  color:#c9a87a; font-size:24px; font-weight:700;
}

#viewer {
  position:absolute; inset:0; z-index:400;
  background:rgba(20,10,0,.85);
  display:none; align-items:center; justify-content:center; padding:24px;
  flex-direction:column;
}
#viewer.show { display:flex; }
#viewer .polaroid {
  background:#fff; padding:14px 14px 60px;
  border-radius:6px; box-shadow:0 14px 50px rgba(0,0,0,.5);
  transform:scale(.9); animation:polaroidIn .35s ease forwards;
}
@keyframes polaroidIn { 0% { transform:scale(.8) rotate(-3deg); } 100% { transform:scale(1) rotate(0); } }
#viewer .polaroid img { width:260px; max-width:70vw; aspect-ratio:1/1; object-fit:cover; display:block; }
#viewer .polaroid .caption { margin-top:14px; color:#5a3a1a; font-size:15px; font-weight:700; text-align:center; max-width:280px; }
#viewer .close-hint { margin-top:20px; color:#fff; font-size:13px; opacity:.7; }

#toast {
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  background:rgba(122,64,24,.9); color:#fff;
  padding:10px 20px; border-radius:999px; font-size:14px;
  z-index:500; opacity:0; transition:opacity .3s; pointer-events:none;
}
#toast.show { opacity:1; }
</style>
</head>
<body>
<div id="stage">

  <button class="q-btn" id="btnBack" title="返回">
    <svg viewBox="0 0 24 24" fill="none" stroke="#7a4018" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"></line>
      <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
  </button>

  <div id="rightStack">
    <button class="q-btn" id="btnSound" title="声音">
      <svg id="soundIcon" viewBox="0 0 24 24" fill="none" stroke="#7a4018" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      </svg>
    </button>
    <button class="q-btn" id="btnCamera" title="收集照片">
      <svg viewBox="0 0 24 24" fill="none" stroke="#7a4018" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
        <circle cx="12" cy="13" r="4"></circle>
      </svg>
    </button>
    <button class="q-btn" id="btnAlbum" title="相册">
      <svg viewBox="0 0 24 24" fill="none" stroke="#7a4018" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"></rect>
        <circle cx="8.5" cy="8.5" r="1.5"></circle>
        <polyline points="21 15 16 10 5 21"></polyline>
      </svg>
    </button>
  </div>

  <div class="page active" id="p1">
    <video class="bg-video" id="p1video" src="视频/p1动画.mp4" playsinline preload="auto" muted></video>
    <button id="btnStart"></button>
    <button class="q-btn" id="btnSoundP1" title="声音" style="position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:60;">
      <svg viewBox="0 0 24 24" fill="none" stroke="#7a4018" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      </svg>
    </button>
  </div>

  <div class="page" id="p2">
    <video class="bg-video" id="p2video" src="视频/p2.mp4" playsinline muted></video>
  </div>

  <div class="page" id="p3">
    <video class="bg-video" id="p3video" src="视频/p3.mp4" playsinline muted loop></video>
    <div id="card-mask"></div>
    <div id="card-game"></div>
  </div>

  <div class="page" id="p4">
    <video class="bg-video" id="p4video" src="视频/p4-p5转场动画.mp4" playsinline muted></video>
  </div>

  <div class="page" id="p5">
    <video class="bg-video" id="p5video" src="视频/p5-p6转场.mp4" playsinline preload="auto" muted></video>
    <div class="ingredient" id="ing-flour" data-type="flour" style="background-image:url('png/第五页-像素厨房分层PNG/02-面粉袋.png')"></div>
    <div class="ingredient" id="ing-egg"   data-type="egg"   style="background-image:url('png/第五页-像素厨房分层PNG/03-鸡蛋.png')"></div>
    <div class="ingredient pos-left"  id="ing-straw" data-type="straw" style="background-image:url('png/第五页-像素厨房分层PNG/04-草莓.png')"></div>
    <div class="ingredient pos-mid"   id="ing-blue"  data-type="blue"  style="background-image:url('png/第五页-像素厨房分层PNG/06-蓝莓.png')"></div>
    <div class="ingredient pos-right" id="ing-choco" data-type="choco" style="background-image:url('png/第五页-像素厨房分层PNG/07-巧克力.png')"></div>
    <div class="result" id="result-cake"></div>
  </div>

  <div class="page" id="p6">
    <img class="bg-img" src="png/p6-bg.png" alt="">
  </div>

  <div class="page" id="p7">
    <video class="bg-video" id="p7video" src="视频/p7.mp4" playsinline preload="auto" muted></video>
  </div>

  <div id="dialog">
    <div class="avatar" id="dialogAvatar"></div>
    <div class="bubble" id="dialogBubble">
      <div class="text" id="dialogText"></div>
      <div class="hint" id="dialogHint">点击继续 ▸</div>
    </div>
  </div>

  <div id="shootFrame">
    <img id="shootImg" src="" alt="">
    <div class="flash"></div>
  </div>

  <div id="albumMask">
    <div id="albumPanel">
      <h2>我们的一天</h2>
      <div class="sub">收集到的回忆</div>
      <div id="albumGrid"></div>
    </div>
  </div>

  <div id="viewer">
    <div class="polaroid">
      <img id="viewerImg" src="" alt="">
      <div class="caption" id="viewerCaption"></div>
    </div>
    <div class="close-hint">点击任意位置关闭</div>
  </div>

  <div id="endMask">
    <div id="endPanel">
      <div class="line1">谢谢你，今天玩得好开心！</div>
      <div class="line2">拉钩，明天不见不散～</div>
      <button class="again-btn" id="btnAgain"><img src="png/btn-again.png" alt=""></button>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script>
const PAGES = ['p1','p2','p3','p4','p5','p6','p7'];

const PHOTOS = {
  p2: { src:'png/p2.png', caption:'窗台相遇 —— 那天阳光真好' },
  p3: { src:'png/p3.png', caption:'玩牌的下午 —— 我们玩得好开心' },
  p4: { src:'png/p4.png', caption:'一起打游戏 —— 一起打游戏最棒' },
  p5: { src:'png/p5.png', caption:'一起做蛋糕 —— 草莓味的一天' },
  p6: { src:'png/p6.png', caption:'草地野餐 —— 草地上的午后' },
  p7: { src:'png/p7.png', caption:'看星星的夜晚 —— 晚安，明天见' }
};

const STORY = {
  p2: { lines:[
    { speaker:'dog',  text:'今天天气真好呀～' },
    { speaker:'bird', text:'要一起出去玩吗？' }
  ]},
  p3: { lines:[
    { speaker:'dog',  text:'咱们来玩牌吧！' }
  ]},
  p3done: { lines:[
    { speaker:'bird', text:'全都配对啦，你好厉害～' }
  ]},
  p4: { lines:[
    { speaker:'dog',  text:'一起来玩游戏吧！' },
    { speaker:'bird', text:'看谁得分高！' }
  ]},
  p5: { lines:[
    { speaker:'bird', text:'按顺序点材料放进碗里吧！' }
  ]},
  p5done: { lines:[
    { speaker:'dog',  text:'蛋糕做好啦！' },
    { speaker:'bird', text:'看起来好好吃～' }
  ]},
  p6: { lines:[
    { speaker:'dog',  text:'点一点云朵吧～' }
  ]},
  p6done: { lines:[
    { speaker:'dog',  text:'哇！云朵变成骨头啦！' },
    { speaker:'bird', text:'还有小鸟和蛋糕云！' },
    { speaker:'dog',  text:'今天真是神奇的一天～' }
  ]},
  p7: { lines:[
    { speaker:'dog',  text:'晚安，明天见。' },
    { speaker:'bird', text:'明天还要一起玩！' }
  ]}
};

let current = 'p1';
let collected = new Set();
let bgmOn = true;
let dialogIndex = 0;
let dialogLocked = false;
let transitioning = false;
let p5Step = 0, p5Done = false;
let p3Done = false, p6Done = false;
let p3Stage = 0;
let p4DialogDone = false;
let p7DialogDone = false;

const $ = id => document.getElementById(id);
const btnBack = $('btnBack');
const rightStack = $('rightStack');
const dialog = $('dialog');
const dialogAvatar = $('dialogAvatar');
const dialogText = $('dialogText');
const dialogHint = $('dialogHint');
const btnCamera = $('btnCamera');
const btnAlbum = $('btnAlbum');

/* ===== 音频（路径改成 audio/） ===== */
const bgm = new Audio('bgm.wav');
bgm.loop = true;
bgm.volume = 0.5;

const sfxClick = new Audio('audio/点击.wav');
const sfxCard = new Audio('audio/翻牌完成.wav');
const sfxTV = new Audio('audio/电视转场.wav');
const sfxCloud = new Audio('audio/云.wav');
sfxClick.volume = 0.5;
sfxCard.volume = 0.6;
sfxTV.volume = 0.6;
sfxCloud.volume = 0.6;

function playSfx(audio) {
  if (!bgmOn) return;
  try {
    audio.currentTime = 0;
    audio.play().catch(()=>{});
  } catch (e) {}
}

let audioCtx = null;
function playShutter() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    const o1 = audioCtx.createOscillator();
    const g1 = audioCtx.createGain();
    o1.type = 'square';
    o1.frequency.setValueAtTime(1800, now);
    o1.frequency.exponentialRampToValueAtTime(400, now + 0.05);
    g1.gain.setValueAtTime(0.15, now);
    g1.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
    o1.connect(g1); g1.connect(audioCtx.destination);
    o1.start(now); o1.stop(now + 0.07);
    const o2 = audioCtx.createOscillator();
    const g2 = audioCtx.createGain();
    o2.type = 'square';
    o2.frequency.setValueAtTime(1200, now + 0.06);
    o2.frequency.exponentialRampToValueAtTime(300, now + 0.12);
    g2.gain.setValueAtTime(0.001, now + 0.06);
    g2.gain.linearRampToValueAtTime(0.12, now + 0.07);
    g2.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
    o2.connect(g2); g2.connect(audioCtx.destination);
    o2.start(now + 0.06); o2.stop(now + 0.15);
  } catch (e) {}
}

/* ===== 视频工具 ===== */
function loopRange(video, startSec, endSec) {
  if (!video) return;
  video.loop = false;
  video.currentTime = startSec;
  video.play().catch(()=>{});
  const handler = () => {
    if (video.currentTime >= endSec || video.currentTime < startSec - 0.3) {
      video.currentTime = startSec;
    }
  };
  video.addEventListener('timeupdate', handler);
  video._loopHandler = handler;
}
function stopLoop(video) {
  if (!video) return;
  if (video._loopHandler) {
    video.removeEventListener('timeupdate', video._loopHandler);
    video._loopHandler = null;
  }
}
function playFromTo(video, startSec, endSec, cb) {
  if (!video) { cb && cb(); return; }
  stopLoop(video);
  video.currentTime = startSec;
  video.play().catch(()=>{});
  const handler = () => {
    if (video.currentTime >= endSec) {
      video.removeEventListener('timeupdate', handler);
      video.pause();
      cb && cb();
    }
  };
  video.addEventListener('timeupdate', handler);
}

function showDialog() { dialog.classList.add('show'); }
function hideDialog() { dialog.classList.remove('show'); }

function goTo(pageId, opts) {
  opts = opts || {};
  if (pageId === current && !opts.force) return;
  PAGES.forEach(p => { const el = $(p); if (el) el.classList.remove('active'); });
  $('p' + pageId.slice(1)).classList.add('active');
  current = pageId;

  if (current === 'p1') {
    btnBack.classList.remove('show');
    rightStack.classList.remove('show');
    hideDialog();
  } else {
    btnBack.classList.add('show');
    rightStack.classList.add('show');
    showDialog();
  }

  if (PHOTOS[current]) {
    btnCamera.classList.remove('hide');
    btnCamera.dataset.page = current;
  } else {
    btnCamera.classList.add('hide');
  }

  if (current === 'p2') {
    const v = $('p2video'); v.currentTime = 0; v.play().catch(()=>{});
    startDialog('p2');
  }
  if (current === 'p3') {
    const v = $('p3video'); v.currentTime = 0; v.play().catch(()=>{});
    if (opts.reset) {
      p3Done = false; p3Stage = 0;
      resetCardGame(); hideCardGame();
    }
    if (p3Stage === 0) startDialog('p3');
    else if (p3Stage === 1) { showCardGame(); hideDialog(); }
    else startDialog('p3done');
  }
  if (current === 'p4') {
    const v = $('p4video');
    stopLoop(v);
    v.currentTime = 0; v.muted = true;
    loopRange(v, 0, 1.0);
    p4DialogDone = false;
    startDialog('p4');
  }
  if (current === 'p5') {
    if (opts.reset || !p5Done) {
      p5Done = false;
      resetP5();
    }
  }
  if (current === 'p6') {
    if (opts.reset || !p6Done) {
      p6Done = false;
      startP6Clouds();
    } else {
      startDialog('p6done');
    }
  }
  if (current === 'p7') {
    const v = $('p7video');
    stopLoop(v);
    v.currentTime = 0; v.muted = true;
    loopRange(v, 0, 1.0);
    p7DialogDone = false;
    startDialog('p7');
  }
}

/* ===== 对话框 ===== */
function startDialog(key) {
  const story = STORY[key];
  if (!story) return;
  dialogIndex = 0;
  dialogLocked = false;
  renderLine(key);
}
function renderLine(key) {
  const story = STORY[key];
  const line = story.lines[dialogIndex];
  if (!line) return;
  dialogAvatar.className = 'avatar' + (line.speaker === 'bird' ? ' bird' : '');
  dialogText.textContent = line.text;
  dialogHint.textContent = '点击继续 ▸';
}

$('dialogBubble').addEventListener('click', () => {
  playSfx(sfxClick);
  if (dialogLocked) return;

  if (current === 'p3' && p3Stage === 0) {
    p3Stage = 1;
    hideDialog(); showCardGame();
    return;
  }

  if (current === 'p4') {
    const story = STORY['p4'];
    if (dialogIndex < story.lines.length - 1) {
      dialogIndex++;
      renderLine('p4');
    } else if (!p4DialogDone) {
      p4DialogDone = true;
      const v = $('p4video');
      const dur = v.duration || 4;
      hideDialog();
      playFromTo(v, 1.0, dur, () => {
        goTo('p5', {reset:true});
      });
    }
    return;
  }

  if (current === 'p5' && p5Done) {
    const story = STORY['p5done'];
    if (dialogIndex < story.lines.length - 1) {
      dialogIndex++;
      renderLine('p5done');
    } else {
      goTo('p6', {reset:true});
    }
    return;
  }

  if (current === 'p7') {
    const story = STORY['p7'];
    if (dialogIndex < story.lines.length - 1) {
      dialogIndex++;
      renderLine('p7');
    } else {
      if (!p7DialogDone) {
        p7DialogDone = true;
        const v = $('p7video');
        stopLoop(v);
        const dur = v.duration || 4;
        loopRange(v, Math.max(0, dur - 3), dur);
        // 提前 1 秒 → 5 秒后弹
        setTimeout(() => {
          const vv = $('p7video');
          vv.pause();
          $('endMask').classList.add('show');
        }, 5000);
      }
    }
    return;
  }

  let key = current;
  if (current === 'p3' && p3Done) key = 'p3done';
  if (current === 'p6' && p6Done) key = 'p6done';
  const story = STORY[key];
  if (!story) return;
  if (dialogIndex < story.lines.length - 1) {
    dialogIndex++;
    renderLine(key);
  }
});

/* ===== P3 翻牌 ===== */
function resetCardGame() {
  const game = $('card-game');
  game.innerHTML = '';
  const faces = ['pai1.png','pai2.png','pai3.png'];
  let deck = [];
  faces.forEach(f => { deck.push(f); deck.push(f); });
  deck.sort(() => Math.random() - 0.5);
  let first = null, lock = false, matched = 0;
  deck.forEach(face => {
    const c = document.createElement('div');
    c.className = 'card';
    c.style.setProperty('--face', `url('png/${face}')`);
    c.dataset.face = face;
    c.addEventListener('click', () => {
      if (lock || c.classList.contains('flipped') || c.classList.contains('matched')) return;
      playSfx(sfxClick);
      c.classList.add('flipped');
      if (!first) { first = c; return; }
      if (first.dataset.face === c.dataset.face) {
        first.classList.add('matched'); c.classList.add('matched');
        matched++; first = null;
        playSfx(sfxCard);
        if (matched === 3) {
          p3Done = true; p3Stage = 2;
          setTimeout(() => {
            hideCardGame(); showDialog();
            startDialog('p3done');
          }, 700);
        }
      } else {
        lock = true;
        const a = first, b = c;
        setTimeout(() => {
          a.classList.remove('flipped'); b.classList.remove('flipped');
          first = null; lock = false;
        }, 900);
      }
    });
    game.appendChild(c);
  });
}
function showCardGame() { $('card-mask').classList.add('show'); $('card-game').classList.add('show'); }
function hideCardGame() { $('card-mask').classList.remove('show'); $('card-game').classList.remove('show'); }

/* ===== P5 ===== */
function resetP5() {
  p5Step = 0; p5Done = false;
  ['ing-flour','ing-egg','ing-straw','ing-blue','ing-choco'].forEach(id => {
    const el = $(id);
    if (!el) return;
    el.classList.remove('show','hidden');
  });
  $('result-cake').classList.remove('show');
  $('result-cake').style.backgroundImage = '';

  const v = $('p5video');
  v.pause();
  v.currentTime = 0;
  v.muted = true;

  $('ing-flour').classList.add('show');
  showDialog();
  startDialog('p5');
}
function showStep(step) {
  if (step === 1) {
    $('ing-egg').classList.add('show');
    dialogText.textContent = '面粉加好了！接着点鸡蛋～';
  } else if (step === 2) {
    $('ing-straw').classList.add('show');
    $('ing-blue').classList.add('show');
    $('ing-choco').classList.add('show');
    dialogText.textContent = '鸡蛋也好了！选个水果吧～';
  }
}
function initP5Click() {
  document.querySelectorAll('#p5 .ingredient').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      if (p5Done || !el.classList.contains('show')) return;
      playSfx(sfxClick);
      handleP5Click(el);
    });
  });
}
function handleP5Click(el) {
  const type = el.dataset.type;
  if (p5Step === 0 && type === 'flour') { el.classList.remove('show'); el.classList.add('hidden'); p5Step=1; showStep(1); return; }
  if (p5Step === 1 && type === 'egg')   { el.classList.remove('show'); el.classList.add('hidden'); p5Step=2; showStep(2); return; }
  if (p5Step === 2 && (type==='straw'||type==='blue'||type==='choco')) {
    el.classList.remove('show'); el.classList.add('hidden');
    ['straw','blue','choco'].forEach(t => {
      if (t !== type) {
        const other = $('ing-' + t);
        if (other) { other.classList.remove('show'); other.classList.add('hidden'); }
      }
    });
    p5Step = 3;
    hideDialog();

    let cakeImg = '';
    if (type === 'straw') cakeImg = '05-完成的草莓纸杯蛋糕.png';
    if (type === 'blue')  cakeImg = '08-完成的蓝莓星空纸杯蛋糕.png';
    if (type === 'choco') cakeImg = '09-完成的巧克力曲奇纸杯蛋糕.png';

    const v = $('p5video');
    v.currentTime = 0;
    v.muted = true;
    v.play().catch(()=>{});
    v.onended = () => {
      v.pause();
      p5Done = true;
      const cake = $('result-cake');
      cake.style.backgroundImage = `url('png/第五页-像素厨房分层PNG/${cakeImg}')`;
      cake.classList.add('show');
      setTimeout(() => {
        showDialog();
        startDialog('p5done');
      }, 500);
    };
  }
}

/* ===== P6 云 ===== */
const CLOUD_FACES = ['03-骨头云.png','04-小鸟云.png','05-纸杯蛋糕云.png'];
function startP6Clouds() {
  p6Done = false;
  const p6 = $('p6');
  p6.querySelectorAll('.cloud').forEach(c => c.remove());
  showDialog();
  startDialog('p6');
  const faces = [...CLOUD_FACES].sort(() => Math.random() - 0.5);
  // 缩小到 245×165，位置更靠中间
  const positions = [
    { left: '8%',  top: '8%'  },
    { left: '38%', top: '22%' },
    { left: '60%', top: '8%'  }
  ];
  for (let i = 0; i < 3; i++) {
    const cloud = document.createElement('div');
    cloud.className = 'cloud';
    cloud.style.left = positions[i].left;
    cloud.style.top  = positions[i].top;
    cloud._phaseX = Math.random() * Math.PI * 2;
    cloud._phaseY = Math.random() * Math.PI * 2;
    cloud._speed = 0.012 + Math.random() * 0.008;
    cloud.dataset.face = faces[i];
    cloud.dataset.done = '0';
    cloud.addEventListener('click', () => {
      if (cloud.dataset.done === '1') return;
      playSfx(sfxCloud);
      cloud.dataset.done = '1';
      cloud.style.backgroundImage = `url('png/第六页-云朵互动分层PNG/${cloud.dataset.face}')`;
      cloud.classList.add('changed');
      const done = p6.querySelectorAll('.cloud[data-done="1"]').length;
      if (done === 3) {
        p6Done = true;
        setTimeout(() => startDialog('p6done'), 800);
      }
    });
    p6.appendChild(cloud);
  }
  if (window._cloudTimer) clearInterval(window._cloudTimer);
  window._cloudTimer = setInterval(() => {
    p6.querySelectorAll('.cloud').forEach(cloud => {
      cloud._phaseX += cloud._speed;
      cloud._phaseY += cloud._speed * 0.8;
      // 飘动幅度限制 ±25px / ±18px
      const dx = Math.sin(cloud._phaseX) * 25;
      const dy = Math.cos(cloud._phaseY) * 18;
      cloud.style.transform = `translate(${dx}px, ${dy}px)`;
    });
  }, 30);
}

/* ===== 相机 ===== */
btnCamera.addEventListener('click', () => {
  const page = btnCamera.dataset.page;
  if (!page || !PHOTOS[page] || collected.has(page)) return;
  const photo = PHOTOS[page];
  playShutter();
  const frame = $('shootFrame');
  $('shootImg').src = photo.src;
  frame.classList.remove('show');
  void frame.offsetWidth;
  frame.classList.add('show');
  setTimeout(() => frame.classList.remove('show'), 900);
  setTimeout(() => {
    collected.add(page);
    flyPhoto(photo.src);
  }, 500);
});
function flyPhoto(src) {
  const r1 = btnCamera.getBoundingClientRect();
  const r2 = btnAlbum.getBoundingClientRect();
  const img = document.createElement('img');
  img.src = src;
  img.className = 'fly-photo';
  img.style.left = r1.left + 'px';
  img.style.top  = r1.top  + 'px';
  document.body.appendChild(img);
  requestAnimationFrame(() => {
    img.style.left = (r2.left + r2.width/2 - 20) + 'px';
    img.style.top  = (r2.top + r2.height/2 - 20) + 'px';
    img.style.width = '20px';
    img.style.height= '20px';
    img.style.opacity = '0.3';
  });
  setTimeout(() => img.remove(), 750);
}

/* ===== 翻页 ===== */
function nextPage() {
  if (dialogLocked || transitioning) return;
  if (current === 'p5' && !p5Done) return;
  if (current === 'p3' && p3Stage === 1) return;
  if (current === 'p6' && !p6Done) return;
  if (current === 'p4') return;
  if (current === 'p7') return;
  const idx = PAGES.indexOf(current);
  const next = PAGES[idx + 1];
  if (!next) return;
  goTo(next, {reset:true});
}
function prevPage() {
  if (dialogLocked || transitioning) return;
  const idx = PAGES.indexOf(current);
  const prev = PAGES[idx - 1];
  if (!prev) return;
  goTo(prev, {reset:true});
}

let touchStartY = 0;
document.addEventListener('touchstart', e => {
  if (e.target.closest('.ingredient, .card, .cloud, .q-btn, #dialog, .photo-card, #viewer, #albumMask, #shootFrame, #endMask')) return;
  touchStartY = e.touches[0].clientY;
}, { passive:true });
document.addEventListener('touchend', e => {
  if (e.target.closest('.ingredient, .card, .cloud, .q-btn, #dialog, .photo-card, #viewer, #albumMask, #shootFrame, #endMask')) return;
  const dy = touchStartY - e.changedTouches[0].clientY;
  if (Math.abs(dy) < 60) return;
  if (dy > 0) nextPage();
  else prevPage();
});
let wheelLock = false;
document.addEventListener('wheel', e => {
  if (wheelLock) return;
  if (Math.abs(e.deltaY) < 20) return;
  wheelLock = true;
  setTimeout(() => wheelLock = false, 800);
  if (e.deltaY > 0) nextPage();
  else prevPage();
}, { passive:true });
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'PageDown') nextPage();
  if (e.key === 'ArrowUp'   || e.key === 'PageUp')   prevPage();
});
btnBack.addEventListener('click', prevPage);

/* ===== 声音 ===== */
$('btnSound').addEventListener('click', toggleSound);
$('btnSoundP1').addEventListener('click', toggleSound);
function toggleSound() {
  bgmOn = !bgmOn;
  if (bgmOn) {
    bgm.play().catch(()=>{});
  } else {
    bgm.pause();
  }
  updateSoundIcon();
}
function updateSoundIcon() {
  const icons = document.querySelectorAll('#btnSound svg, #btnSoundP1 svg');
  icons.forEach(svg => {
    if (bgmOn) {
      svg.innerHTML = `
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>`;
    } else {
      svg.innerHTML = `
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <line x1="23" y1="9" x2="17" y2="15"></line>
        <line x1="17" y1="9" x2="23" y2="15"></line>`;
    }
  });
}

/* ===== 相册弹窗 ===== */
btnAlbum.addEventListener('click', () => {
  buildAlbum();
  $('albumMask').classList.add('show');
});
$('albumMask').addEventListener('click', e => {
  if (e.target === $('albumMask')) $('albumMask').classList.remove('show');
});

function buildAlbum() {
  const grid = $('albumGrid');
  grid.innerHTML = '';
  Object.keys(PHOTOS).forEach(page => {
    const photo = PHOTOS[page];
    if (collected.has(page)) {
      const card = document.createElement('div');
      card.className = 'photo-card';
      card.innerHTML = `<img src="${photo.src}" alt="">`;
      card.addEventListener('click', () => openViewer(photo));
      grid.appendChild(card);
    } else {
      const card = document.createElement('div');
      card.className = 'photo-card locked';
      card.textContent = '?';
      grid.appendChild(card);
    }
  });
}

function openViewer(photo) {
  $('viewerImg').src = photo.src;
  $('viewerCaption').textContent = photo.caption;
  $('viewer').classList.add('show');
}
$('viewer').addEventListener('click', () => $('viewer').classList.remove('show'));

/* ===== 结束弹窗 ===== */
$('btnAgain').addEventListener('click', () => {
  $('endMask').classList.remove('show');
  collected.clear();
  p3Done = p6Done = p5Done = false;
  p3Stage = 0;
  p4DialogDone = false;
  p7DialogDone = false;
  goTo('p1', {force:true});
  $('btnStart').style.display = 'block';
  $('p1video').currentTime = 0;
});

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

/* ===== P1 开启 ===== */
$('btnStart').addEventListener('click', () => {
  const v = $('p1video');
  v.muted = false; v.currentTime = 0; v.play().catch(()=>{});
  $('btnStart').style.display = 'none';
  if (bgmOn) bgm.play().catch(()=>{});
  const jump = () => { v.ontimeupdate=null; v.onended=null; v.pause(); goTo('p2', {reset:true}); };
  v.ontimeupdate = () => { if (v.duration && v.currentTime >= v.duration - 0.3) jump(); };
  v.onended = jump;
});

initP5Click();
updateSoundIcon();
goTo('p1', {force:true});
</script>
